[project]
name = "yoyo-honey-s"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vanibhardwaj365", email = "vanibhardwaj365@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "pymupdf>=2.1",
